define host {
    name                          generic-host
    event_handler_enabled         1
    flap_detection_enabled        1
    notification_period           24x7
    notifications_enabled         1
    process_perf_data             1
    register                      0
    retain_nonstatus_information  1
    retain_status_information     1
}

define host {
    name                          network-device
    use                           generic-host
    check_command                 check-host-alive
    check_interval                2
    check_period                  24x7
    contact_groups                admins,network-admins
    max_check_attempts            5
    notification_interval         60
    notification_options          d,u,r
    notification_period           24x7
    register                      0
    retry_interval                1
}

define host {
    name                          linux-server
    use                           generic-host
    check_command                 check-host-alive
    check_interval                5
    check_period                  24x7
    contact_groups                admins,linux-admins
    max_check_attempts            10
    notification_interval         120
    notification_options          d,u,r
    notification_period           workhours
    register                      0
    retry_interval                1
}

define host {
    name                          windows-server
    use                           generic-host
    check_command                 check-host-alive
    check_interval                5
    check_period                  24x7
    contact_groups                admins,windows-admins
    max_check_attempts            10
    notification_interval         120
    notification_options          d,u,r
    notification_period           workhours
    register                      0
    retry_interval                1
